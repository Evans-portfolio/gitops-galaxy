apiVersion: v1
kind: Service
metadata:
  name: {{ include "sorcery.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "sorcery.fullname" . }}-frontend
spec:
  selector:
    app: {{ include "sorcery.fullname" . }}-frontend
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.frontend.port }}
  type: ClusterIP
