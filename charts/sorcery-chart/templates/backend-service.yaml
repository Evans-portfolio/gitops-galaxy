apiVersion: v1
kind: Service
metadata:
  name: {{ include "sorcery.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "sorcery.fullname" . }}-backend
spec:
  selector:
    app: {{ include "sorcery.fullname" . }}-backend
  ports:
    - name: http
      port: 8080
      targetPort: {{ .Values.backend.port }}
  type: ClusterIP
