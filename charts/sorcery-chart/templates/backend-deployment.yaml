apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sorcery.fullname" . }}-backend
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "sorcery.fullname" . }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "sorcery.fullname" . }}-backend
  template:
    metadata:
      labels:
        app: {{ include "sorcery.fullname" . }}-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          args:
            {{- toYaml .Values.backend.args | nindent 12 }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            {{- toYaml .Values.backend.env | nindent 12 }}
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "sorcery.fullname" . }}-config
                  key: APP_ENVIRONMENT
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
