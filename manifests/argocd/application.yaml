apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sorcery-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitea.kood.tech/evanschepkwony1/gitops-galaxy.git
    targetRevision: HEAD
    path: charts/sorcery-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
