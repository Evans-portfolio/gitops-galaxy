apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg-credentials
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pg-credentials
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: database/pg-credentials
        property: password
    - secretKey: postgres-password
      remoteRef:
        key: database/pg-credentials
        property: postgres-password
