apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-ci
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-ci-role
  namespace: argocd
rules:
  # Jenkins only needs to create/update the sorcery-app Application resource
  # (kubectl apply) — no other resource types, no other namespaces.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-ci-rolebinding
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: jenkins-ci
    namespace: argocd
roleRef:
  kind: Role
  name: jenkins-ci-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-ci-token
  namespace: argocd
  annotations:
    kubernetes.io/service-account.name: jenkins-ci
type: kubernetes.io/service-account-token
